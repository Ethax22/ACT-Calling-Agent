# nginx for the Azure test VM: the website bot and the phone agent on one address.
# The Python services listen on 127.0.0.1 only; nginx forwards just the paths below.
# DNS_NAME_HERE is replaced during setup (deploy/AZURE.md step 8); certbot then adds HTTPS.
#
#   /                                   website page with the Agni AI widget (static files)
#   /widget/chat                        rag-backend 8000 (typed chat)
#   /voice/en /voice/ta /detect-language  voice-pipeline 8001 (website voice)
#   /test                               phone agent 8002 (browser test line)
#   /vobiz/...                          phone agent 8002 (real phone line, Phase 5)
#   /health                             phone agent 8002
#
# rag-backend's keyed routes (/v1/chat/completions, /calling-agent/ask, /admin/...)
# and erp-lookup (8100) are deliberately not forwarded.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name DNS_NAME_HERE;

    # Whole site behind a password: every chat and call spends vendor credits, and the
    # test line can read student records. Vobiz and /health are let through below.
    auth_basic "Agni AI test server";
    auth_basic_user_file /etc/nginx/act-agent.htpasswd;

    # Calls are websockets that stay open up to the 15-minute cap.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;

    # Website page (copied here from ACT-Voice-Assistant/widget, AZURE.md step 7).
    root /var/www/agni-widget;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    location = /widget/chat {
        proxy_pass http://127.0.0.1:8000;
    }

    location /voice/ {
        proxy_pass http://127.0.0.1:8001;
    }

    location = /detect-language {
        proxy_pass http://127.0.0.1:8001;
    }

    location /test {
        proxy_pass http://127.0.0.1:8002;
    }

    # Vobiz cannot send a password. No /vobiz routes exist yet; Phase 5 must have the
    # phone agent check that a request really comes from Vobiz before it acts on it.
    location /vobiz/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }
}
