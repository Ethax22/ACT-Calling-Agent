# nginx in front of the phone agent. Only this is public; rag-backend (8000) and
# erp-lookup (8100) listen on 127.0.0.1 and are reached by the phone agent on the VM itself.
# DNS_NAME_HERE is replaced during setup (deploy/AZURE.md step 8); certbot then adds HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name DNS_NAME_HERE;

    # Calls are websockets that stay open up to the 15-minute cap.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;

    # No API listing to the public.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Browser test line: password only. Each test call spends vendor credits and can
    # read student records, so it must not be open to anyone who finds the address.
    location /test {
        auth_basic "Agni AI test line";
        auth_basic_user_file /etc/nginx/act-agent.htpasswd;
        proxy_pass http://127.0.0.1:8002;
    }

    # /health now; the Vobiz answer URL and audio stream (Phase 5) also land here.
    location / {
        proxy_pass http://127.0.0.1:8002;
    }
}
